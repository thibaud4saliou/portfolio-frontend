name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Le build ne contacte pas l'API (rendu à la requête) : une URL factice suffit.
      API_INTERNAL_URL: http://localhost:5000
      SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage   # lance aussi les tests, échoue sous les seuils
      - run: npm run build

      - name: Audit des dépendances (vulnérabilités hautes)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 14
